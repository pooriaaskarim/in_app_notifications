name: Deploy NFQ Studio to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install root dependencies
        run: flutter pub get

      - name: Generate Dartdoc API reference
        run: dart doc --output doc/api

      - name: Install example dependencies
        run: flutter pub get
        working-directory: example

      - name: Build Flutter Web
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"
        working-directory: example

      - name: Copy API docs into web release
        run: |
          mkdir -p build/web/api
          cp -r ../doc/api/* build/web/api/
        working-directory: example

      - name: Add 404.html fallback for SPA routing
        run: cp build/web/index.html build/web/404.html
        working-directory: example

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: example/build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
