name: flutter_notification_queue
description: >-
  A contextless, overlay-based in-app notification queue for Flutter.
  Supports spatial positioning, gesture intents, priority triage,
  notification grouping, and a rich event stream — all without BuildContext.
version: 0.4.0

homepage: https://github.com/pooriaaskarim/flutter_notification_queue
repository: https://github.com/pooriaaskarim/flutter_notification_queue
issue_tracker: https://github.com/pooriaaskarim/flutter_notification_queue/issues
documentation: https://pooriaaskarim.github.io/flutter_notification_queue/api/

topics:
  - notification
  - overlay
  - toast
  - popup
  - ui

funding:
  - https://github.com/sponsors/pooriaaskarim

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.7.0'

dependencies:
  flutter:
    sdk: flutter
  logd: ^0.8.6
  meta: '>=1.9.0 <2.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.3
  logd_linters: ^0.1.1

flutter:
  uses-material-design: true
